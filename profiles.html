<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Who's Watching? — StreamFlix</title>
    <meta name="description" content="Select or manage viewing profiles for your StreamFlix account.">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
</head>
<body class="profiles-page-body">

    <!-- Minimal Header -->
    <header class="profiles-header">
        <a href="index.html" class="logo" aria-label="StreamFlix Home">STREAMFLIX</a>
    </header>

    <!-- Main Profiles Selection Container -->
    <main class="profiles-main">
        <div class="profiles-container" id="profiles-container">
            <h1 class="profiles-title" id="profiles-heading">Who's watching?</h1>

            <!-- Loading State -->
            <div class="profiles-loading" id="profiles-loading">
                <div class="section-loading">Loading profiles...</div>
            </div>

            <!-- Profiles Grid -->
            <div class="profiles-grid" id="profiles-grid" style="display: none;">
                <!-- Dynamically populated profile cards -->
            </div>

            <!-- Manage Profiles Action Bar -->
            <div class="profiles-actions-bar">
                <button type="button" class="btn btn-manage-profiles" id="btn-toggle-manage">
                    Manage Profiles
                </button>
            </div>
        </div>
    </main>

    <!-- Create / Edit Profile Modal -->
    <div class="profile-modal" id="profile-edit-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="modal-profile-title">
        <div class="profile-modal-overlay" id="profile-modal-overlay"></div>
        <div class="profile-modal-content">
            <h2 class="modal-profile-title" id="modal-profile-title">Add Profile</h2>
            <p class="modal-profile-desc">Add a viewing persona for another person watching StreamFlix.</p>

            <form id="profile-form" class="profile-form">
                <input type="hidden" id="form-profile-id" value="">

                <!-- Avatar Selection Row -->
                <div class="avatar-selector-section">
                    <label class="form-label">Choose Avatar:</label>
                    <div class="avatar-options" id="avatar-options-grid">
                        <label class="avatar-choice">
                            <input type="radio" name="profile-avatar" value="avatar-1" checked>
                            <span class="avatar-preview avatar-1">😊</span>
                        </label>
                        <label class="avatar-choice">
                            <input type="radio" name="profile-avatar" value="avatar-2">
                            <span class="avatar-preview avatar-2">😎</span>
                        </label>
                        <label class="avatar-choice">
                            <input type="radio" name="profile-avatar" value="avatar-3">
                            <span class="avatar-preview avatar-3">🍿</span>
                        </label>
                        <label class="avatar-choice">
                            <input type="radio" name="profile-avatar" value="avatar-4">
                            <span class="avatar-preview avatar-4">🐱</span>
                        </label>
                        <label class="avatar-choice">
                            <input type="radio" name="profile-avatar" value="avatar-5">
                            <span class="avatar-preview avatar-5">👑</span>
                        </label>
                        <label class="avatar-choice">
                            <input type="radio" name="profile-avatar" value="avatar-6">
                            <span class="avatar-preview avatar-6">🤖</span>
                        </label>
                    </div>
                </div>

                <!-- Name Input -->
                <div class="form-group">
                    <label for="profile-name-input" class="form-label">Profile Name</label>
                    <input type="text" id="profile-name-input" class="profile-input" placeholder="Name" required minlength="2" maxlength="30">
                </div>

                <!-- Kids Profile Checkbox -->
                <div class="form-checkbox-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="profile-kids-checkbox">
                        <span class="checkbox-custom"></span>
                        <span class="checkbox-text">Kids Profile? (Kid-friendly titles)</span>
                    </label>
                </div>

                <!-- Modal Actions -->
                <div class="profile-modal-actions">
                    <button type="submit" class="btn btn-primary" id="btn-save-profile">Save</button>
                    <button type="button" class="btn btn-secondary-action" id="btn-cancel-profile">Cancel</button>
                    <button type="button" class="btn btn-delete-profile" id="btn-delete-profile" style="display: none;">Delete Profile</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notifications Container -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <!-- Firebase SDK (v10 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js" defer></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js" defer></script>

    <!-- Application Scripts -->
    <script src="js/config.js" defer></script>
    <script src="js/firebase-config.js" defer></script>
    <script src="js/auth.js" defer></script>
    <script src="js/profiles.js" defer></script>
</body>
</html>
