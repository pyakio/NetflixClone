<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sign In — Netflix Clone. Access your personalized movie streaming experience and saved watchlist.">
    <title>Sign In — Netflix Clone</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-body">

    <!-- Auth Header / Logo -->
    <header class="auth-header">
        <a href="index.html" class="logo" aria-label="Netflix Clone Homepage">NETFLIX</a>
    </header>

    <!-- Main Auth Container -->
    <main class="auth-container">
        <div class="auth-card">
            <h1 class="auth-title">Sign In</h1>

            <!-- Error Banner -->
            <div id="auth-error" class="auth-error-banner" role="alert" aria-live="polite" style="display: none;"></div>

            <!-- Login Form -->
            <form id="login-form" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="login-email" class="form-label">Email Address</label>
                    <input 
                        type="email" 
                        id="login-email" 
                        name="email" 
                        class="form-input" 
                        placeholder="name@example.com" 
                        autocomplete="email" 
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="login-password" class="form-label">Password</label>
                    <div class="password-input-wrapper">
                        <input 
                            type="password" 
                            id="login-password" 
                            name="password" 
                            class="form-input" 
                            placeholder="Enter your password" 
                            autocomplete="current-password" 
                            required
                        >
                        <button 
                            type="button" 
                            class="password-toggle-btn" 
                            id="toggle-password" 
                            aria-label="Show password"
                        >Show</button>
                    </div>
                </div>

                <button type="submit" id="login-submit" class="btn btn-auth-submit">
                    <span class="btn-text">Sign In</span>
                </button>
            </form>

            <!-- Auth Switch / Footer -->
            <div class="auth-footer-text">
                <p>New to Netflix? <a href="register.html" class="auth-link">Sign up now.</a></p>
                <p class="auth-return"><a href="index.html" class="auth-link-secondary">← Back to Browse</a></p>
            </div>
        </div>
    </main>

    <!-- Toast Notifications Container -->
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <!-- Firebase SDK (v10 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <!-- Project Auth Scripts -->
    <script src="js/config.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('login-form');
            const emailInput = document.getElementById('login-email');
            const passwordInput = document.getElementById('login-password');
            const togglePasswordBtn = document.getElementById('toggle-password');
            const submitBtn = document.getElementById('login-submit');
            const btnText = submitBtn.querySelector('.btn-text');
            const errorBanner = document.getElementById('auth-error');

            // Password show/hide toggle
            if (togglePasswordBtn && passwordInput) {
                togglePasswordBtn.addEventListener('click', () => {
                    const isPassword = passwordInput.type === 'password';
                    passwordInput.type = isPassword ? 'text' : 'password';
                    togglePasswordBtn.textContent = isPassword ? 'Hide' : 'Show';
                    togglePasswordBtn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
                });
            }

            // Display error
            function showError(message) {
                if (errorBanner) {
                    errorBanner.textContent = message;
                    errorBanner.style.display = 'block';
                }
            }

            // Hide error
            function hideError() {
                if (errorBanner) {
                    errorBanner.textContent = '';
                    errorBanner.style.display = 'none';
                }
            }

            // Set button loading state
            function setLoading(isLoading) {
                if (submitBtn) {
                    submitBtn.disabled = isLoading;
                    btnText.textContent = isLoading ? 'Signing In...' : 'Sign In';
                }
            }

            // If user is already logged in, redirect to homepage
            AuthService.onAuthStateChange((user) => {
                if (user) {
                    window.location.href = 'index.html';
                }
            });

            // Form Submit Handler
            if (form) {
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    hideError();

                    const email = emailInput.value.trim();
                    const password = passwordInput.value;

                    // Client validation
                    if (!email) {
                        showError('Please enter your email address.');
                        emailInput.focus();
                        return;
                    }

                    if (!AuthService.isValidEmail(email)) {
                        showError('Please enter a valid email address.');
                        emailInput.focus();
                        return;
                    }

                    if (!password) {
                        showError('Please enter your password.');
                        passwordInput.focus();
                        return;
                    }

                    setLoading(true);

                    try {
                        await AuthService.login(email, password);
                        // Redirect on successful sign in
                        window.location.href = 'index.html';
                    } catch (error) {
                        const friendlyMsg = AuthService.getFriendlyErrorMessage(error);
                        showError(friendlyMsg);
                    } finally {
                        setLoading(false);
                    }
                });
            }
        });
    </script>
</body>
</html>
